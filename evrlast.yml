template-id: evrlast
name: evrlast
description: Integrate with Evrlast
logo-url: https://www.tagback.de/wp-content/uploads/2025/06/logo_evrlast.png
info-url: https://www.tagback.de/evrlast
documentation-url: https://docs.evrlast.com/
tts-documentation-url: https://www.thethingsindustries.com/docs/integrations/cloud-integrations/evrlast/
fields:
  - id: evrlast_Auth_Key
    name: auth_key
    description: The username for Basic Auth to connect to Evrlast
    secret: false
  - id: evrlast_Auth_Secret
    name: auth_key_secret
    description: The password for Basic Auth to connect to Evrlast
    secret: true
format: json
headers:
  Authorization: Basic {base64:auth_key:auth_key_secret}
base-url: https://datareceiver.cloud.evrlast.com
paths:
  uplink-message: /uplink
  join-accept: /join/accept
field-mask:
  - end_device_ids.device_id
  - end_device_ids.dev_eui
  - end_device_ids.application_ids.application_id
  - end_device_ids.join_eui
  - uplink_message.decoded_payload
  - uplink_message.rx_metadata
  - uplink_message.f_port
  - uplink_message.frm_payload
  - uplink_message.settings.data_rate
  - uplink_message.settings.data_rate.frequency
  - uplink_message.settings.data_rate.modulation.lora.spreading_factor
  - uplink_message.settings.data_rate.modulation.lora.bandwidth
  - received_at